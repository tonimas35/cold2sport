    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sea)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>
  <g fill="none" stroke="#8a6a44" stroke-opacity="0.18" stroke-width="2">
    <circle cx="1380" cy="760" r="90"/>
