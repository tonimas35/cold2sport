    <radialGradient id="sea" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#d6ece9"/>
      <stop offset="60%" stop-color="#c3dfdc"/>
      <stop offset="100%" stop-color="#e9dcc0"/>
    </radialGradient>
    <pattern id="waves" width="120" height="40" patternUnits="userSpaceOnUse">
